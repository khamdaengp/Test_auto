name: Automated QA Playwright Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run automatically every day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run E2E Desktop Web Tests
      run: npx playwright test tests/e2e/web-app.spec.ts --project=chromium

    - name: Run Mobile Web Emulation Tests
      run: npx playwright test tests/mobile/mobile-web.spec.ts --project=mobile-chrome

    - name: Run API Integration Tests
      run: npx playwright test tests/api/api-integration.spec.ts --project=api

    - name: Upload Test Results & Failure Media
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-test-artifacts
        path: test-results/
        retention-days: 14
