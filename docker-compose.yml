version: '3.8'

services:
  qa_postgres:
    image: postgres:16-alpine
    container_name: qa_dashboard_postgres
    restart: always
    environment:
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password
      POSTGRES_DB: qa_dashboard
    ports:
      - "5434:5432"
    volumes:
      - qa_postgres_data:/var/lib/postgresql/data

  qa_adminer:
    image: adminer:latest
    container_name: qa_dashboard_adminer
    restart: always
    ports:
      - "8088:8080"
    environment:
      ADMINER_DEFAULT_SERVER: qa_postgres
    depends_on:
      - qa_postgres

volumes:
  qa_postgres_data:
